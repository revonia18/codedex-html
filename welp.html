<!DOCTYPE html>
<html>

<head>
    <title>Welp</title>
</head>

<body>
    <h1>Welp is like Yelp, for Games! .</h1>
    <form>
        <h2>Welp</h2>

        <label for="game">Name of the game.*<label>
                <input type="text" id="game" required></input>
                <br><br>

                <label for="try">Would you try it again*<label>
                        <input type="radio" id="try" name="option">Yes</input>
                        <input type="radio" id="try" name="option">No</input>
                        <input type="radio" id="try" name="option">Maybe</input>
                        <br><br>

                        <label for="rating">Rating Review*<label>
                                <input type="number" min="1" max="5" required id="rating"></input>
                                <br><br>


                                <label for="comment">Comment</label>
                                <textarea rows="4" cols="26" maxlength="250" minlength="10"
                                    placeholder="leave a comment"></textarea>
                                <br><br>

                                <input type="submit"></input>
    </form>
</body>

</html>
